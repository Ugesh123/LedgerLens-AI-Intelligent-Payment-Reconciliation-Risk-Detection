name: pages

# Publishes the LedgerLens AI dashboard to GitHub Pages.
#
# The static build uses the current engine and datasets to generate
# the dashboard data. The frontend can use the live backend when available
# and fall back to the recorded snapshots in web/public/data.
#
# One-time setup:
# Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "datasets/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate dashboard data
        run: |
          python scripts/build_site_data.py --out web/public/data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build LedgerLens AI dashboard
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: https://recon-engine-yjim.onrender.com
        run: npm run build

      - name: Configure client-side routes
        run: |
          cp web/dist/index.html web/dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy LedgerLens AI to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
